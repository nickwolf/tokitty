[project]
name = "tokitty"
version = "0.4.0"
description = "A cat-themed desktop widget for tracking Claude Code and Codex usage limits"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pystray", "Pillow>=10.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff==0.15.22"]
streamdock = ["comtypes; sys_platform == 'win32'"]
packaging = ["pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.7"]

[project.scripts]
tokitty = "tokitty.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tokitty*"]

[tool.setuptools.package-data]
tokitty = [
    "prices.json",
    "streamdock/plugin/com.tokitty.deck.sdPlugin/manifest.json",
    "streamdock/plugin/com.tokitty.deck.sdPlugin/index.html",
    "streamdock/plugin/com.tokitty.deck.sdPlugin/pi.html",
    "streamdock/plugin/com.tokitty.deck.sdPlugin/icon.png",
]

[tool.pytest.ini_options]
# The `gui` marker guards tests that need a real Tk display (run under xvfb in
# CI). Deselected by default so `pytest` stays headless-green everywhere.
markers = ["gui: requires a live Tk display (run via `xvfb-run -a pytest -m gui`)"]
addopts = "-m 'not gui'"

[tool.ruff]
target-version = "py310"
