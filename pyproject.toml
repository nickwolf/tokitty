[project]
name = "tokitty"
version = "0.7.0"
description = "A cat-themed desktop widget for tracking Claude Code and Codex usage limits"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PySide6-Essentials==6.12.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff==0.15.22", "Pillow>=10.1"]
streamdock = ["comtypes; sys_platform == 'win32'"]
# Pillow draws the app icon at build time (tokitty/app_icon.py, freeze/tokitty.spec).
packaging = ["pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.7", "Pillow>=10.1"]

[project.scripts]
tokitty = "tokitty.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tokitty*"]

[tool.setuptools.package-data]
tokitty = [
    "prices.json",
    "streamdock/plugin/com.tokitty.deck.sdPlugin/manifest.json",
    "streamdock/plugin/com.tokitty.deck.sdPlugin/index.html",
    "streamdock/plugin/com.tokitty.deck.sdPlugin/pi.html",
    "streamdock/plugin/com.tokitty.deck.sdPlugin/icon.png",
    "streamdock/fonts/Aileron-Regular.ttf",
    "streamdock/fonts/NOTICE.txt",
]

[tool.pytest.ini_options]
# The `qt` marker guards tests that need PySide6 (a core dependency), run with
# QT_QPA_PLATFORM=offscreen in the `qt` CI job.
markers = [
    "qt: requires PySide6 (run via `QT_QPA_PLATFORM=offscreen pytest -m qt`)",
]
addopts = "-m 'not qt'"

[tool.ruff]
target-version = "py310"
