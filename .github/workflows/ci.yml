name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # PySide6 is a dependency, and collecting tests/qt imports QtGui, which
      # links libEGL; the runner image does not carry it.
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1
      - run: pip install -e ".[dev]"
      - run: pytest

  qt:
    name: qt (${{ matrix.os }}, py3.14)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Qt offscreen plugin libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1
      - run: pip install -e ".[dev]"
      - name: probe 128
        run: |
          if [ "$RUNNER_OS" = Linux ]; then grep -m1 'model name' /proc/cpuinfo; grep -m1 -oE 'avx512[a-z]*' /proc/cpuinfo | sort -u | tr '\n' ' '; fi
          if [ "$RUNNER_OS" = macOS ]; then sysctl -n machdep.cpu.brand_string; fi
          if [ "$RUNNER_OS" = Windows ]; then powershell -c "(Get-CimInstance Win32_Processor).Name"; fi
          python tests/qt/probe_128.py probe-out | grep PROBE
          QT_SCALE_FACTOR=2 python tests/qt/probe_128.py probe-out | grep PROBE
          ONLYCARD=1 QT_NO_CPU_FEATURE="avx512f avx512bw avx512vl avx512dq avx512cd" python tests/qt/probe_128.py probe-noavx | sed 's/PROBE /PROBE NOAVX512 /' | grep card_low || true
          ONLYCARD=1 QT_QPA_PLATFORM=offscreen:fontengine=freetype python tests/qt/probe_128.py probe-ft | sed 's/PROBE /PROBE FT /' | grep -E 'card|text_' || true
      - uses: actions/upload-artifact@v4
        with:
          name: probe-128-${{ matrix.os }}
          path: probe-out
      - run: pytest -m qt
      - name: Upload pixel diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-diff-${{ matrix.os }}
          path: build/pixel-diff/
          if-no-files-found: ignore

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -e ".[dev]"
      - run: ruff check .
