name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # PySide6 is a dependency, and collecting tests/qt imports QtGui, which
      # links libEGL; the runner image does not carry it.
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1
      - run: pip install -e ".[dev]"
      - run: pytest

  qt:
    name: qt (${{ matrix.os }}, py3.14)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          # The pixel report reads the reference PNGs at the pull request's base commit.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Qt offscreen plugin libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1
      - run: pip install -e ".[dev]"
      - run: pytest -m qt
      - name: Upload pixel diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-diff-${{ matrix.os }}
          path: build/pixel-diff/
          if-no-files-found: ignore
      - name: Pixel reference report
        if: always() && github.event_name == 'pull_request' && runner.os == 'Linux'
        run: python tests/qt/pixel_check.py report ${{ github.event.pull_request.base.sha }}
      - name: Upload pixel report
        if: always() && github.event_name == 'pull_request' && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: pixel-report
          path: build/pixel-report/
          if-no-files-found: ignore

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -e ".[dev]"
      - run: ruff check .
