name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      trim:
        description: Trim Qt in the bundle. Turn off once to measure untrimmed sizes. A tag push always trims.
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    env:
      TOKITTY_BUILD_TOOLKITS: tk,qt
      TOKITTY_QT_TRIM: ${{ (github.event_name == 'workflow_dispatch' && !inputs.trim) && '0' || '1' }}
      # The release the legacy update pass starts from. Pinned on purpose
      # and moved deliberately, never to "latest".
      LEGACY_TAG: v0.6.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
            overhead_gate_ms: 90
          - os: ubuntu-22.04
            target: linux-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install -e ".[packaging,streamdock,qt]"

      - name: Install xvfb and the Qt xcb libraries (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libxcb-shape0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-xkb1 libxkbcommon-x11-0

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=dryrun-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the tag matches pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="v$(python -c 'import sys; sys.path.insert(0, "freeze"); from bundle_data import project_version; print(project_version("."))')"
          if [[ "$GITHUB_REF_NAME" != "$want" ]]; then
            echo "::error::tag $GITHUB_REF_NAME, but pyproject.toml is $want. Push the version bump before tagging."
            exit 1
          fi

      - name: Determine archive name
        id: names
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-22.04" ]]; then
            ext=tar.gz
          else
            ext=zip
          fi
          echo "archive=tokitty-${{ steps.version.outputs.version }}-${{ matrix.target }}.$ext" >> "$GITHUB_OUTPUT"

      - name: Build with PyInstaller
        env:
          TOKITTY_BUILD_ID: ${{ steps.version.outputs.version }}
        run: python -m PyInstaller freeze/tokitty.spec --noconfirm --distpath dist --workpath build

      - name: Archive (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          python -c "import shutil; shutil.make_archive('tokitty-${{ steps.version.outputs.version }}-${{ matrix.target }}', 'zip', 'dist', 'Tokitty')"

      - name: Archive (macOS)
        if: startsWith(matrix.os, 'macos')
        run: ditto -c -k --keepParent dist/Tokitty.app "${{ steps.names.outputs.archive }}"

      - name: Archive (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: tar -czf "${{ steps.names.outputs.archive }}" -C dist tokitty

      - name: Write archive checksum
        run: |
          python -c "import hashlib, sys; name = sys.argv[1]; digest = hashlib.file_digest(open(name, 'rb'), 'sha256').hexdigest(); open(name + '.sha256', 'w', newline='\n').write(f'{digest}  {name}\n')" "${{ steps.names.outputs.archive }}"
          cat "${{ steps.names.outputs.archive }}.sha256"

      - name: Extract (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir -p "$RUNNER_TEMP/extracted"
          python -c "import zipfile, os; zipfile.ZipFile('${{ steps.names.outputs.archive }}').extractall(os.path.join(os.environ['RUNNER_TEMP'], 'extracted'))"

      - name: Extract (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          mkdir -p "$RUNNER_TEMP/extracted"
          ditto -x -k "${{ steps.names.outputs.archive }}" "$RUNNER_TEMP/extracted"

      - name: Extract (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mkdir -p "$RUNNER_TEMP/extracted"
          tar -xzf "${{ steps.names.outputs.archive }}" -C "$RUNNER_TEMP/extracted"

      - name: Verify artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: python freeze/verify_artifact.py --app-dir "$RUNNER_TEMP/extracted/Tokitty" --work "$RUNNER_TEMP/verify" --report "$RUNNER_TEMP/report.json" --expect-toolkits tk,qt

      - name: Verify artifact (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          args=(--app-dir "$RUNNER_TEMP/extracted" --work "$RUNNER_TEMP/verify" --report "$RUNNER_TEMP/report.json" --expect-toolkits tk,qt)
          if [ -n "${{ matrix.overhead_gate_ms }}" ]; then
            args+=(--overhead-gate-ms "${{ matrix.overhead_gate_ms }}")
          fi
          # The bundle's OpenSSL looks for trusted roots in this Python's
          # etc/openssl, which a user's Mac doesn't have. Hide it so the
          # self-check's tls check sees what users see.
          openssl_dir="$(python -c 'import os, ssl; print(os.path.dirname(ssl.get_default_verify_paths().openssl_cafile))')"
          sudo mv "$openssl_dir" "$openssl_dir.hidden"
          trap 'sudo mv "$openssl_dir.hidden" "$openssl_dir"' EXIT
          unset SSL_CERT_FILE SSL_CERT_DIR
          python freeze/verify_artifact.py "${args[@]}"

      - name: Verify artifact (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: xvfb-run -a python freeze/verify_artifact.py --app-dir "$RUNNER_TEMP/extracted/tokitty" --work "$RUNNER_TEMP/verify" --report "$RUNNER_TEMP/report.json" --expect-toolkits tk,qt

      - name: Install cryptography (update verifier)
        run: pip install cryptography

      - name: Choose update test inputs
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-22.04" ]]; then
            ext=tar.gz
          else
            ext=zip
          fi
          {
            echo "OLD_ARCHIVE=$RUNNER_TEMP/old/tokitty-v0.0.1-${{ matrix.target }}.$ext"
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              # A dry run's build ID doesn't parse as a version, so the update
              # test uses a v99.0.0 rebuild of this commit: a rehearsal. The
              # number sits above any real release, so it is always an update.
              echo "UPDATE_TAG=v99.0.0"
              echo "REHEARSAL=true"
              echo "NEW_ARCHIVE=$RUNNER_TEMP/new/tokitty-v99.0.0-${{ matrix.target }}.$ext"
              echo "NEW_SUMS=$RUNNER_TEMP/new/tokitty-v99.0.0-${{ matrix.target }}.$ext.sha256"
            else
              echo "UPDATE_TAG=${{ steps.version.outputs.version }}"
              echo "REHEARSAL=false"
              echo "NEW_ARCHIVE=$GITHUB_WORKSPACE/${{ steps.names.outputs.archive }}"
              echo "NEW_SUMS=$GITHUB_WORKSPACE/${{ steps.names.outputs.archive }}.sha256"
            fi
          } >> "$GITHUB_ENV"

      - name: Build old fixture (v0.0.1)
        env:
          TOKITTY_BUILD_ID: v0.0.1
        run: python -m PyInstaller freeze/tokitty.spec --noconfirm --distpath dist-old --workpath build-old

      - name: Archive old fixture
        run: |
          mkdir -p "$RUNNER_TEMP/old"
          case "${{ matrix.os }}" in
            windows-latest)
              python -c "import os, shutil; shutil.make_archive(os.path.join(os.environ['RUNNER_TEMP'], 'old', 'tokitty-v0.0.1-${{ matrix.target }}'), 'zip', 'dist-old', 'Tokitty')"
              ;;
            ubuntu-22.04)
              tar -czf "$OLD_ARCHIVE" -C dist-old tokitty
              ;;
            *)
              ditto -c -k --keepParent dist-old/Tokitty.app "$OLD_ARCHIVE"
              ;;
          esac

      - name: Build rehearsal artifact (v99.0.0, workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          TOKITTY_BUILD_ID: v99.0.0
        run: python -m PyInstaller freeze/tokitty.spec --noconfirm --distpath dist-new --workpath build-new

      - name: Archive rehearsal artifact (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p "$RUNNER_TEMP/new"
          case "${{ matrix.os }}" in
            windows-latest)
              python -c "import os, shutil; shutil.make_archive(os.path.join(os.environ['RUNNER_TEMP'], 'new', 'tokitty-v99.0.0-${{ matrix.target }}'), 'zip', 'dist-new', 'Tokitty')"
              ;;
            ubuntu-22.04)
              tar -czf "$NEW_ARCHIVE" -C dist-new tokitty
              ;;
            *)
              ditto -c -k --keepParent dist-new/Tokitty.app "$NEW_ARCHIVE"
              ;;
          esac
          python -c "import hashlib, os, sys; path = sys.argv[1]; digest = hashlib.file_digest(open(path, 'rb'), 'sha256').hexdigest(); open(path + '.sha256', 'w', newline='\n').write(f'{digest}  {os.path.basename(path)}\n')" "$NEW_ARCHIVE"
          cat "$NEW_SUMS"

      - name: Verify update
        run: |
          args=(--old-archive "$OLD_ARCHIVE" --new-archive "$NEW_ARCHIVE" --new-sums "$NEW_SUMS" --tag "$UPDATE_TAG" --work "$RUNNER_TEMP/vu" --report "$RUNNER_TEMP/update-report.json")
          if [ "$REHEARSAL" = "true" ]; then
            args+=(--rehearsal)
          fi
          if [[ "${{ matrix.os }}" == "ubuntu-22.04" ]]; then
            xvfb-run -a python freeze/verify_update.py "${args[@]}"
          else
            python freeze/verify_update.py "${args[@]}"
          fi

      - name: Verify update (Qt)
        run: |
          args=(--old-archive "$OLD_ARCHIVE" --new-archive "$NEW_ARCHIVE" --new-sums "$NEW_SUMS" --tag "$UPDATE_TAG" --qt --only apply_update,no_ack_rollback --work "$RUNNER_TEMP/vu-qt" --report "$RUNNER_TEMP/update-report-qt.json")
          if [ "$REHEARSAL" = "true" ]; then
            args+=(--rehearsal)
          fi
          if [[ "${{ matrix.os }}" == "ubuntu-22.04" ]]; then
            xvfb-run -a python freeze/verify_update.py "${args[@]}"
          else
            python freeze/verify_update.py "${args[@]}"
          fi

      - name: Verify update from a shipped release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-22.04" ]]; then
            ext=tar.gz
          else
            ext=zip
          fi
          name="tokitty-$LEGACY_TAG-${{ matrix.target }}.$ext"
          gh release download "$LEGACY_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$RUNNER_TEMP/legacy"
          args=(--old-archive "$RUNNER_TEMP/legacy/$name" --old-tag "$LEGACY_TAG" --new-archive "$NEW_ARCHIVE" --new-sums "$NEW_SUMS" --tag "$UPDATE_TAG" --only apply_update --work "$RUNNER_TEMP/vu-legacy" --report "$RUNNER_TEMP/update-report-legacy.json")
          if [ "$REHEARSAL" = "true" ]; then
            args+=(--rehearsal)
          fi
          if [[ "${{ matrix.os }}" == "ubuntu-22.04" ]]; then
            xvfb-run -a python freeze/verify_update.py "${args[@]}"
          else
            python freeze/verify_update.py "${args[@]}"
          fi

      - name: Append report summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os

          report_path = os.path.join(os.environ["RUNNER_TEMP"], "report.json")
          target = "${{ matrix.target }}"
          print(f"### {target}")
          if not os.path.exists(report_path):
              print("- no report.json was written")
              raise SystemExit(0)
          with open(report_path, encoding="utf-8") as f:
              data = json.load(f)
          print(f"- overall: {'PASS' if data.get('ok') else 'FAIL'}")
          sizes = data.get("sizes", {})
          if "app_dir_bytes" in sizes:
              archive = os.path.join(os.environ["GITHUB_WORKSPACE"], "${{ steps.names.outputs.archive }}")
              archive_bytes = os.path.getsize(archive) if os.path.exists(archive) else "unknown"
              print(f"- archive size: {archive_bytes} bytes, extracted size: {sizes['app_dir_bytes']} bytes")
          timing = data.get("steps", {}).get("hook_timing", {}).get("detail", {})
          if isinstance(timing, dict) and "median_ms" in timing:
              cold_ms = timing.get("cold_s", 0) * 1000
              min_ms = timing.get("min_s", 0) * 1000
              max_ms = timing.get("max_s", 0) * 1000
              print(
                  f"- hook cold: {cold_ms:.1f} ms, median: {timing['median_ms']:.1f} ms "
                  f"(min {min_ms:.1f}, max {max_ms:.1f})"
              )

          # #48 Task 1: the plain-Python baseline on the same runner, for
          # comparison against the frozen median above. Informational only
          # -- it never changes the overall PASS/FAIL printed above.
          baseline = data.get("steps", {}).get("hook_timing_baseline", {}).get("detail", {})
          if isinstance(baseline, dict) and "median_ms" in baseline:
              b_cold_ms = baseline.get("cold_s", 0) * 1000
              b_min_ms = baseline.get("min_s", 0) * 1000
              b_max_ms = baseline.get("max_s", 0) * 1000
              frozen_median_ms = baseline.get("frozen_median_ms")
              diff_ms = baseline.get("diff_ms")
              print(
                  f"- hook baseline (plain python, sys.executable={baseline.get('sys_executable')}): "
                  f"cold {b_cold_ms:.1f} ms, median {baseline['median_ms']:.1f} ms "
                  f"(min {b_min_ms:.1f}, max {b_max_ms:.1f})"
              )
              if frozen_median_ms is not None and diff_ms is not None:
                  print(
                      f"  frozen median {frozen_median_ms:.1f} ms vs baseline median "
                      f"{baseline['median_ms']:.1f} ms, difference {diff_ms:.1f} ms"
                  )
              frozen_series_ms = [round(t * 1000, 3) for t in (baseline.get("frozen_timings_s") or [])]
              baseline_series_ms = [round(t * 1000, 3) for t in (baseline.get("timings_s") or [])]
              print(f"  frozen series (ms): {frozen_series_ms}")
              print(f"  baseline series (ms): {baseline_series_ms}")

          # #48 dry run 2: the gate decision, judged after both of the above
          # have measured. gate_kind is "overhead" only for the matrix entry
          # that passed --overhead-gate-ms (macos-15-intel); everyone else
          # gets the absolute gate.
          gate_step = data.get("steps", {}).get("hook_timing_gate", {})
          gate = gate_step.get("detail", {})
          if isinstance(gate, dict) and "gate_kind" in gate:
              verdict = "PASS" if gate_step.get("ok") else "FAIL"
              threshold_ms = gate.get("threshold_ms")
              frozen_median_ms = gate.get("frozen_median_ms")
              baseline_median_ms = gate.get("baseline_median_ms")
              line = f"- gate ({gate['gate_kind']}): {verdict}, threshold {threshold_ms} ms, frozen median {frozen_median_ms} ms"
              if baseline_median_ms is not None:
                  line += f", baseline median {baseline_median_ms} ms"
              print(line)
              if gate.get("error"):
                  print(f"  {gate['error']}")

          # hook_timing and hook_timing_baseline are pure measurements that
          # always run; only hook_timing_gate decides pass/fail for the
          # hook-timing concern, so the two measurement steps are excluded
          # here the same way verify_artifact.py's INFORMATIONAL_STEPS
          # excludes them from report["ok"].
          informational_steps = {"hook_timing", "hook_timing_baseline"}
          for name, step in data.get("steps", {}).items():
              if name in informational_steps:
                  continue
              if not step.get("ok"):
                  print(f"- FAILED step `{name}`: {step.get('detail')}")
          PY

      - name: Append update report summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os

          report_path = os.path.join(os.environ["RUNNER_TEMP"], "update-report.json")
          target = "${{ matrix.target }}"
          print(f"### {target} update test")
          if not os.path.exists(report_path):
              print("- no update-report.json was written")
              raise SystemExit(0)
          with open(report_path, encoding="utf-8") as f:
              data = json.load(f)
          label = "REHEARSAL (v99.0.0 rebuild of this commit)" if data.get("rehearsal") else "the release being published"
          print(f"- overall: {'PASS' if data.get('ok') else 'FAIL'}, new side: {data.get('tag')}, {label}")
          steps = data.get("steps", {})
          for name, step in steps.items():
              print(f"- {name}: {'ok' if step.get('ok') else 'FAILED'}")
              if not step.get("ok"):
                  print(f"  `{json.dumps(step.get('detail'))[:1500]}`")
          env = steps.get("env_dump", {}).get("detail", {})
          if isinstance(env, dict):
              for label_name, info in env.items():
                  if isinstance(info, dict):
                      print(f"- env_dump {label_name}: {', '.join(info.get('env') or []) or 'none set'}")
          tls = steps.get("tls_github", {}).get("detail", {})
          if isinstance(tls, dict) and isinstance(tls.get("report"), dict):
              print(f"- tls_github: latest release seen {tls['report'].get('latest')}")
          apply_run = steps.get("apply_update", {}).get("detail", {})
          if isinstance(apply_run, dict) and isinstance(apply_run.get("apply"), dict):
              print(f"- apply_update: exit {apply_run['apply'].get('returncode')} after {apply_run['apply'].get('elapsed_s')} s")
          rollback = steps.get("no_ack_rollback", {}).get("detail", {})
          if isinstance(rollback, dict) and isinstance(rollback.get("apply"), dict):
              print(f"- no_ack_rollback: exit {rollback['apply'].get('returncode')} after {rollback['apply'].get('elapsed_s')} s")
          PY

      - name: Append Qt and shipped-release update summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os

          target = "${{ matrix.target }}"
          print(f"### {target} Qt and shipped-release update tests")
          for label, file_name in (
              ("Tk update", "update-report.json"),
              ("Qt update", "update-report-qt.json"),
              (f"update from {os.environ['LEGACY_TAG']}", "update-report-legacy.json"),
          ):
              path = os.path.join(os.environ["RUNNER_TEMP"], file_name)
              if not os.path.exists(path):
                  print(f"- {label}: not run")
                  continue
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
              print(f"- {label}: {'PASS' if data.get('ok') else 'FAIL'}")
              if file_name == "update-report-qt.json":
                  apply_run = data.get("steps", {}).get("apply_update", {}).get("detail", {})
                  if isinstance(apply_run, dict) and "after_update_qt" in apply_run:
                      print(f"  after_update_qt: `{json.dumps(apply_run['after_update_qt'])[:1500]}`")
          PY

      - name: Upload archive and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tokitty-${{ matrix.target }}
          path: |
            ${{ steps.names.outputs.archive }}
            ${{ steps.names.outputs.archive }}.sha256
            ${{ runner.temp }}/report.json
            ${{ runner.temp }}/update-report.json
            ${{ runner.temp }}/update-report-qt.json
            ${{ runner.temp }}/update-report-legacy.json

  keychain:
    name: macOS Keychain check (dry run, #48 Task 8)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install -e ".[packaging]"

      - name: Build A
        env:
          TOKITTY_BUILD_ID: A
        run: python -m PyInstaller freeze/tokitty.spec --noconfirm --distpath dist-a --workpath build-a

      - name: Build B
        env:
          TOKITTY_BUILD_ID: B
        run: python -m PyInstaller freeze/tokitty.spec --noconfirm --distpath dist-b --workpath build-b

      - name: Confirm A and B are different binaries (codesign CDHash)
        run: |
          echo "--- build A ---"
          codesign -dv --verbose=4 dist-a/Tokitty.app/Contents/MacOS/Tokitty 2>&1 | tee "$RUNNER_TEMP/codesign-a.txt"
          echo "--- build B ---"
          codesign -dv --verbose=4 dist-b/Tokitty.app/Contents/MacOS/Tokitty 2>&1 | tee "$RUNNER_TEMP/codesign-b.txt"
          hash_a=$(grep -o 'CDHash=[0-9a-fA-F]*' "$RUNNER_TEMP/codesign-a.txt" | sort -u)
          hash_b=$(grep -o 'CDHash=[0-9a-fA-F]*' "$RUNNER_TEMP/codesign-b.txt" | sort -u)
          echo "A: $hash_a"
          echo "B: $hash_b"
          if [ -z "$hash_a" ] || [ -z "$hash_b" ]; then
            echo "codesign produced no CDHash for one of the builds" >&2
            exit 1
          fi
          if [ "$hash_a" == "$hash_b" ]; then
            echo "build A and B have identical CDHash(es); the test would prove nothing" >&2
            exit 1
          fi

      - name: Run keychain_check.py
        run: |
          python freeze/keychain_check.py \
            --build-a dist-a/Tokitty.app \
            --build-b dist-b/Tokitty.app \
            --work "$RUNNER_TEMP/keychain-check"

      - name: Upload keychain check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keychain-check-log
          path: ${{ runner.temp }}/keychain-check/keychain_check.log

  release:
    name: Publish draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t archives < <(find artifacts -type f \( -name 'tokitty-*.zip' -o -name 'tokitty-*.tar.gz' \))
          if [ "${#archives[@]}" -ne 4 ]; then
            echo "expected 4 archives, found ${#archives[@]}: ${archives[*]}" >&2
            exit 1
          fi
          mapfile -t checksums < <(find artifacts -type f -name 'tokitty-*.sha256')
          if [ "${#checksums[@]}" -ne 4 ]; then
            echo "expected 4 .sha256 files, found ${#checksums[@]}: ${checksums[*]}" >&2
            exit 1
          fi
          mkdir release-assets
          cp "${archives[@]}" release-assets/
          for f in "${checksums[@]}"; do
            cat "$f" >> release-assets/SHA256SUMS
          done
          cat release-assets/SHA256SUMS
          (cd release-assets && sha256sum -c SHA256SUMS)
          assets=(release-assets/*)
          if [ "${#assets[@]}" -ne 5 ]; then
            echo "expected 5 assets, found ${#assets[@]}: ${assets[*]}" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes "Automated build of tokitty $GITHUB_REF_NAME. Unsigned, see README for the macOS first-launch steps." \
            "${assets[@]}"
